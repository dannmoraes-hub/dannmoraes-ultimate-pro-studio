<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Remove BG Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f1e8;color:#171717}
.wrap{max-width:1000px;margin:auto;padding:28px 18px}.hero{text-align:center;margin:20px 0 26px}
h1{font-size:clamp(30px,6vw,54px);margin:0 0 8px}.sub{color:#666}
.card{background:#fff;border:2px solid #171717;border-radius:22px;padding:20px;box-shadow:7px 7px 0 #171717}
.drop{min-height:230px;border:2px dashed #777;border-radius:16px;display:grid;place-items:center;text-align:center;padding:25px;cursor:pointer}
.drop.drag{background:#eee}.drop input{display:none}.btn{display:inline-block;border:2px solid #171717;background:#171717;color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;cursor:pointer}
.btn.alt{background:#fff;color:#171717}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
.status{margin-top:15px;padding:12px;border-radius:12px;background:#f0f0f0;display:none}.status.show{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}.panel{border:2px solid #171717;border-radius:16px;overflow:hidden;background:#fafafa}.panel h3{margin:0;padding:12px 14px;border-bottom:2px solid #171717}.preview{min-height:300px;display:grid;place-items:center;padding:15px;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.preview img{max-width:100%;max-height:500px;object-fit:contain}
.meta{font-size:13px;color:#666;padding:10px 14px;border-top:1px solid #ccc}
@media(max-width:700px){.grid{grid-template-columns:1fr}.preview{min-height:220px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><h1>Remove BG Studio</h1><div class="sub">Hapus background foto dengan hasil PNG transparan.</div></div>
  <div class="card">
    <label class="drop" id="drop">
      <input id="file" type="file" accept="image/png,image/jpeg,image/webp">
      <div><div style="font-size:45px">🖼️</div><b>Pilih foto atau drag & drop di sini</b><br><small>PNG, JPG, atau WebP</small></div>
    </label>
    <div class="actions">
      <button class="btn" id="remove" disabled>REMOVE BACKGROUND</button>
      <button class="btn alt" id="reset">RESET</button>
      <button class="btn alt" id="download" disabled>DOWNLOAD PNG</button>
    </div>
    <div class="status" id="status"></div>
    <div class="grid">
      <section class="panel"><h3>Original</h3><div class="preview"><img id="original" alt=""></div><div class="meta" id="origMeta">Belum ada foto</div></section>
      <section class="panel"><h3>Hasil</h3><div class="preview"><img id="result" alt=""></div><div class="meta" id="resultMeta">Belum ada hasil</div></section>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
let file=null, resultBlob=null;

$("drop").addEventListener("click",()=> $("file").click());
$("drop").addEventListener("dragover",e=>{e.preventDefault();$("drop").classList.add("drag")});
$("drop").addEventListener("dragleave",()=>$("drop").classList.remove("drag"));
$("drop").addEventListener("drop",e=>{e.preventDefault();$("drop").classList.remove("drag"); if(e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0])});
$("file").addEventListener("change",e=>{if(e.target.files[0])setFile(e.target.files[0])});

function setFile(f){
  if(!/^image\\/(png|jpeg|webp)$/i.test(f.type)){return show("Format tidak didukung.","error")}
  file=f; resultBlob=null; $("download").disabled=true; $("remove").disabled=false;
  const u=URL.createObjectURL(f); $("original").src=u;
  const im=new Image(); im.onload=()=>{$("origMeta").textContent=`${im.naturalWidth} × ${im.naturalHeight}px • ${fmt(f.size)}`}; im.src=u;
  show("Foto siap diproses.","ok");
}
function show(msg,type="ok"){const s=$("status");s.textContent=msg;s.className="status show"}
function fmt(n){return n<1024*1024?(n/1024).toFixed(1)+" KB":(n/1024/1024).toFixed(2)+" MB"}

$("remove").onclick=async()=>{
 if(!file)return;
 $("remove").disabled=true; $("download").disabled=true; show("Sedang menghapus background…");
 try{
   const body=await toDataURL(file);
   const r=await fetch("/.netlify/functions/remove-bg",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:body})});
   const ct=r.headers.get("content-type")||"";
   if(!r.ok){
     let msg=`Server error ${r.status}`;
     try{const j=await r.json();if(j.error)msg=j.error}catch{}
     throw new Error(msg);
   }
   if(!ct.includes("image/")) throw new Error("Server tidak mengembalikan gambar.");
   resultBlob=await r.blob();
   $("result").src=URL.createObjectURL(resultBlob);
   const im=new Image(); im.onload=()=>{$("resultMeta").textContent=`${im.naturalWidth} × ${im.naturalHeight}px • ${fmt(resultBlob.size)}`}; im.src=$("result").src;
   $("download").disabled=false; show("Selesai. Background berhasil dihapus.");
 }catch(e){show("AI tidak selesai: "+e.message,"error")}
 finally{$("remove").disabled=false}
};

$("download").onclick=()=>{
 if(!resultBlob)return;
 const a=document.createElement("a");a.href=URL.createObjectURL(resultBlob);
 const base=file.name.replace(/\.[^.]+$/,"");a.download=base+"-no-bg.png";a.click();
};

$("reset").onclick=()=>location.reload();

function toDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
</script>
</body>
</html>
